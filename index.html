<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#164438">
  <title>Taskdesk — To-do list</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>
  <main>
    <header class="masthead">
      <div class="brand"><span aria-hidden="true">✓</span> Taskdesk</div>
      <h1>To-do list</h1>
      <p id="count" aria-live="polite">0 tasks left</p>
    </header>
    <section class="panel" aria-label="Manage tasks">
      <form id="form">
        <label for="task">New task</label>
        <div class="entry">
          <input id="task" maxlength="240" placeholder="What needs doing?" required>
          <button class="primary" type="submit">Add task</button>
        </div>
      </form>
      <div class="toolbar">
        <div id="filters" class="filters" role="group" aria-label="Filter tasks">
          <button type="button" data-filter="all" aria-pressed="true">All</button>
          <button type="button" data-filter="active" aria-pressed="false">Active</button>
          <button type="button" data-filter="done" aria-pressed="false">Done</button>
        </div>
        <button type="button" id="clear" disabled>Clear completed</button>
      </div>
      <ul id="list" aria-label="Tasks"></ul>
      <p id="empty">No tasks yet.</p>
      <p id="storage-status" role="status" hidden></p>
    </section>
  </main>
</body>
</html>
